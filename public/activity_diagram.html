<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Activity Diagram - Inventaris JJ Mart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #b0b0b0; font-family: Arial, sans-serif; padding: 28px 18px 50px; }
    h1 { text-align: center; font-size: 16px; font-weight: bold; color: #222; margin-bottom: 16px; }
    .wrap { display: flex; justify-content: center; }
    svg { background: white; border: 2px solid #444; box-shadow: 3px 3px 12px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
<h1>Activity Diagram - Proses Catat Transaksi Stok</h1>
<div class="wrap">
<svg width="900" height="1060" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="11">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- ===== LANE HEADERS ===== -->
  <rect x="1" y="1" width="898" height="1058" fill="white" stroke="#333" stroke-width="2"/>
  <!-- Lane divider -->
  <line x1="450" y1="1" x2="450" y2="1059" stroke="#555" stroke-width="1.5"/>
  <!-- Lane header backgrounds -->
  <rect x="1" y="1" width="449" height="58" fill="#1a3a5c"/>
  <rect x="450" y="1" width="449" height="58" fill="#1a5c3a"/>
  <!-- Lane header text -->
  <text x="225" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Pengguna</text>
  <text x="225" y="48" text-anchor="middle" font-size="10" fill="#aad4f5">(Staff Gudang / Manager)</text>
  <text x="675" y="30" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Sistem &amp; Database</text>
  <text x="675" y="48" text-anchor="middle" font-size="10" fill="#aaf5d4">(Laravel API + MySQL)</text>

  <!-- ===== START ===== -->
  <circle cx="225" cy="90" r="16" fill="#333"/>
  <line x1="225" y1="106" x2="225" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== STEP 1: Buka Menu Transaksi ===== -->
  <rect x="90" y="128" width="270" height="40" rx="20" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="225" y="153" text-anchor="middle">Buka menu Transaksi</text>
  <line x1="225" y1="168" x2="225" y2="190" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== STEP 2: Isi form ===== -->
  <rect x="90" y="193" width="270" height="40" rx="20" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="225" y="215" text-anchor="middle">Isi form (barang, jenis, jumlah)</text>
  <line x1="225" y1="233" x2="225" y2="255" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== STEP 3: Klik Simpan ===== -->
  <rect x="90" y="258" width="270" height="40" rx="20" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="225" y="283" text-anchor="middle">Klik tombol Simpan</text>
  <!-- Arrow crosses lane to right -->
  <line x1="360" y1="278" x2="480" y2="278" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== STEP 4: Validasi data (Lane 2) ===== -->
  <rect x="483" y="258" width="270" height="40" rx="20" fill="white" stroke="#1a5c3a" stroke-width="1.5"/>
  <text x="618" y="283" text-anchor="middle">Validasi data input (API)</text>
  <line x1="618" y1="298" x2="618" y2="320" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== DECISION 1: Data valid? ===== -->
  <polygon points="618,323 700,365 618,407 536,365" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="618" y="360" text-anchor="middle" font-size="10">Data valid &amp;</text>
  <text x="618" y="375" text-anchor="middle" font-size="10">stok cukup?</text>
  <!-- YES: down -->
  <line x1="618" y1="407" x2="618" y2="435" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="632" y="425" font-size="10">Ya</text>
  <!-- NO: left to Lane 1 -->
  <line x1="536" y1="365" x2="420" y2="365" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="490" y="355" text-anchor="middle" font-size="10">Tidak</text>

  <!-- ===== ERROR BOX Lane 1 ===== -->
  <rect x="75" y="344" width="270" height="40" rx="20" fill="#fff0f0" stroke="#cc4444" stroke-width="1.5"/>
  <text x="210" y="369" text-anchor="middle">Tampilkan pesan error</text>
  <!-- Loop back arrow -->
  <line x1="75" y1="364" x2="40" y2="364" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="364" x2="40" y2="213" stroke="#333" stroke-width="1.5"/>
  <line x1="40" y1="213" x2="90" y2="213" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== STEP 5: Lock & simpan transaksi ===== -->
  <rect x="483" y="438" width="270" height="40" rx="20" fill="white" stroke="#1a5c3a" stroke-width="1.5"/>
  <text x="618" y="463" text-anchor="middle">Lock barang (lockForUpdate)</text>
  <line x1="618" y1="478" x2="618" y2="500" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== STEP 6: Simpan record transaksi ===== -->
  <rect x="483" y="503" width="270" height="40" rx="20" fill="white" stroke="#1a5c3a" stroke-width="1.5"/>
  <text x="618" y="528" text-anchor="middle">Simpan record transaksi ke DB</text>
  <line x1="618" y1="543" x2="618" y2="565" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== STEP 7: Update stok ===== -->
  <rect x="483" y="568" width="270" height="40" rx="20" fill="white" stroke="#1a5c3a" stroke-width="1.5"/>
  <text x="618" y="593" text-anchor="middle">Update stok_saat_ini barang</text>
  <line x1="618" y1="608" x2="618" y2="630" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== STEP 8: Hitung ROP ===== -->
  <rect x="483" y="633" width="270" height="40" rx="20" fill="white" stroke="#1a5c3a" stroke-width="1.5"/>
  <text x="618" y="658" text-anchor="middle">Hitung ulang nilai ROP</text>
  <line x1="618" y1="673" x2="618" y2="695" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== STEP 9: Evaluasi status stok ===== -->
  <rect x="483" y="698" width="270" height="40" rx="20" fill="white" stroke="#1a5c3a" stroke-width="1.5"/>
  <text x="618" y="723" text-anchor="middle">Evaluasi status stok barang</text>
  <line x1="618" y1="738" x2="618" y2="760" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== DECISION 2: Stok kritis? ===== -->
  <polygon points="618,763 700,800 618,837 536,800" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="618" y="795" text-anchor="middle" font-size="10">Stok</text>
  <text x="618" y="810" text-anchor="middle" font-size="10">kritis?</text>
  <!-- YES: right arrow -->
  <line x1="700" y1="800" x2="780" y2="800" stroke="#333" stroke-width="1.5"/>
  <text x="735" y="793" font-size="10">Ya</text>
  <!-- NO: down -->
  <line x1="618" y1="837" x2="618" y2="870" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="632" y="857" font-size="10">Tidak</text>

  <!-- ===== LOG KRITIS (side) ===== -->
  <rect x="783" y="782" width="100" height="36" rx="6" fill="#fff8e1" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="833" y="798" text-anchor="middle" font-size="9">Catat log</text>
  <text x="833" y="811" text-anchor="middle" font-size="9">stok kritis</text>
  <!-- rejoin -->
  <line x1="833" y1="818" x2="833" y2="870" stroke="#333" stroke-width="1.2"/>
  <line x1="833" y1="870" x2="618" y2="870" stroke="#333" stroke-width="1.2"/>

  <!-- ===== STEP 10: Return response ===== -->
  <rect x="483" y="873" width="270" height="40" rx="20" fill="white" stroke="#1a5c3a" stroke-width="1.5"/>
  <text x="618" y="898" text-anchor="middle">Kirim response 201 Created</text>
  <!-- Arrow crosses back to Lane 1 -->
  <line x1="483" y1="893" x2="365" y2="893" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== STEP 11: Tampilkan hasil (Lane 1) ===== -->
  <rect x="90" y="873" width="270" height="40" rx="20" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="225" y="898" text-anchor="middle">Tampilkan notifikasi berhasil</text>
  <line x1="225" y1="913" x2="225" y2="940" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===== END ===== -->
  <circle cx="225" cy="960" r="16" fill="white" stroke="#333" stroke-width="3"/>
  <circle cx="225" cy="960" r="10" fill="#333"/>
  <text x="225" y="996" text-anchor="middle" font-size="10" fill="#555">Selesai</text>

  <!-- ===== GUARD LABELS on lane boundary crossings ===== -->
  <!-- Step 3 → Step 4 label -->
  <rect x="395" y="266" width="60" height="18" rx="3" fill="#eef2ff"/>
  <text x="425" y="279" text-anchor="middle" font-size="9" fill="#3730a3">POST /api/transaksi</text>

  <!-- Step 10 → Step 11 label -->
  <rect x="375" y="880" width="50" height="18" rx="3" fill="#ecfdf5"/>
  <text x="400" y="893" text-anchor="middle" font-size="9" fill="#166534">HTTP 201</text>

  <!-- ===== STEP NUMBERS (optional guide) ===== -->
  <text x="860" y="90" fill="#ccc" font-size="9">1</text>
  <text x="860" y="150" fill="#ccc" font-size="9">2</text>
  <text x="860" y="215" fill="#ccc" font-size="9">3</text>
  <text x="860" y="283" fill="#ccc" font-size="9">4</text>
  <text x="860" y="365" fill="#ccc" font-size="9">5</text>
  <text x="860" y="463" fill="#ccc" font-size="9">6</text>
  <text x="860" y="528" fill="#ccc" font-size="9">7</text>
  <text x="860" y="593" fill="#ccc" font-size="9">8</text>
  <text x="860" y="658" fill="#ccc" font-size="9">9</text>
  <text x="860" y="723" fill="#ccc" font-size="9">10</text>
  <text x="860" y="898" fill="#ccc" font-size="9">11</text>

</svg>
</div>
</body>
</html>
