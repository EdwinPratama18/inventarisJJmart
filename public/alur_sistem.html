<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alur Sistem - Inventaris JJ Mart</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #bbb; font-family: Arial, sans-serif; padding: 30px 20px 50px; }
    h1 { text-align: center; font-size: 17px; font-weight: bold; color: #222; margin-bottom: 18px; }
    .wrap { display: flex; justify-content: center; }
    svg { background: white; border: 2px solid #444; box-shadow: 3px 3px 10px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
<h1>Alur Sistem - Inventaris JJ Mart (Proses Transaksi Stok)</h1>
<div class="wrap">
<svg width="700" height="1130" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Outer border -->
  <rect x="1" y="1" width="698" height="1128" fill="white" stroke="#333" stroke-width="2"/>

  <!-- Lane divider -->
  <line x1="350" y1="1" x2="350" y2="1129" stroke="#555" stroke-width="1.5"/>

  <!-- Header cells -->
  <rect x="1"   y="1" width="349" height="58" fill="#e2e2e2" stroke="#555" stroke-width="1"/>
  <rect x="350" y="1" width="349" height="58" fill="#e2e2e2" stroke="#555" stroke-width="1"/>

  <text x="175" y="28" text-anchor="middle" font-size="13" font-weight="bold">Pengguna</text>
  <text x="175" y="47" text-anchor="middle" font-size="11">(Staff / Admin)</text>
  <text x="525" y="28" text-anchor="middle" font-size="13" font-weight="bold">Sistem (Backend)</text>
  <text x="525" y="47" text-anchor="middle" font-size="11">(Laravel + Sanctum API)</text>

  <!-- STEP 1: MULAI (oval, L1, cy=98) -->
  <ellipse cx="175" cy="98" rx="84" ry="26" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="175" y="103" text-anchor="middle" font-size="13" font-weight="bold">Mulai</text>
  <line x1="175" y1="124" x2="175" y2="152" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 2: Login (rect, L1, cy=178) -->
  <rect x="78" y="155" width="194" height="46" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="175" y="183" text-anchor="middle" font-size="12">Login ke sistem</text>
  <line x1="175" y1="201" x2="175" y2="229" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 3: Pilih menu (rect, L1, cy=255) -->
  <rect x="78" y="232" width="194" height="46" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="175" y="260" text-anchor="middle" font-size="12">Pilih menu Transaksi</text>
  <line x1="175" y1="278" x2="175" y2="306" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 4: Isi form (rect, L1, cy=339) -->
  <rect x="78" y="309" width="194" height="58" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="175" y="333" text-anchor="middle" font-size="12">Isi form transaksi</text>
  <text x="175" y="351" text-anchor="middle" font-size="10">(barang, jenis, jumlah)</text>
  <!-- arrow right to L2 -->
  <line x1="272" y1="338" x2="378" y2="338" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 5: Terima data (rect, L2, cy=338) -->
  <rect x="378" y="314" width="194" height="48" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="475" y="342" text-anchor="middle" font-size="12">Terima data transaksi</text>
  <line x1="475" y1="362" x2="475" y2="400" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 6: Data valid & stok cukup? (diamond, L2, cy=444) -->
  <!-- half-w=88, half-h=44: left=387, right=563 -->
  <polygon points="475,400 563,444 475,488 387,444" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="475" y="437" text-anchor="middle" font-size="10">Data valid &amp;</text>
  <text x="475" y="452" text-anchor="middle" font-size="10">stok cukup?</text>
  <!-- Ya down -->
  <line x1="475" y1="488" x2="475" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="489" y="509" font-size="11">Ya</text>
  <!-- Tidak left to L1 -->
  <line x1="387" y1="444" x2="272" y2="444" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="329" y="433" text-anchor="middle" font-size="11">Tidak</text>

  <!-- STEP 6b: Tampilkan error (rect, L1, cy=444) -->
  <rect x="78" y="420" width="194" height="48" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="175" y="441" text-anchor="middle" font-size="11">Tampilkan pesan</text>
  <text x="175" y="457" text-anchor="middle" font-size="11">error ke pengguna</text>
  <!-- Loop kembali ke Step 4 via x=51 -->
  <line x1="78"  y1="444" x2="51"  y2="444" stroke="#333" stroke-width="1.5"/>
  <line x1="51"  y1="444" x2="51"  y2="338" stroke="#333" stroke-width="1.5"/>
  <line x1="51"  y1="338" x2="78"  y2="338" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 7: Simpan transaksi (rect, L2, cy=548) -->
  <rect x="378" y="523" width="194" height="58" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="475" y="547" text-anchor="middle" font-size="12">Simpan transaksi</text>
  <text x="475" y="564" text-anchor="middle" font-size="10">&amp; update stok barang</text>
  <line x1="475" y1="581" x2="475" y2="613" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 8: Hitung ulang ROP (rect, L2, cy=638) -->
  <rect x="378" y="616" width="194" height="52" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="475" y="638" text-anchor="middle" font-size="12">Hitung ulang ROP</text>
  <text x="475" y="655" text-anchor="middle" font-size="10">&amp; perbarui status stok</text>
  <line x1="475" y1="668" x2="475" y2="698" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 9: Cek status stok (rect, L2, cy=723) -->
  <rect x="378" y="701" width="194" height="44" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="475" y="728" text-anchor="middle" font-size="12">Catat status stok barang</text>
  <line x1="475" y1="745" x2="475" y2="775" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 10: Kirim response sukses (rect, L2, cy=800) -->
  <rect x="378" y="778" width="194" height="44" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="475" y="798" text-anchor="middle" font-size="12">Kirim response sukses</text>
  <text x="475" y="813" text-anchor="middle" font-size="10">ke frontend</text>
  <!-- arrow left to L1 -->
  <line x1="378" y1="800" x2="272" y2="800" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 11: Tampilkan hasil (rect, L1, cy=800) -->
  <rect x="78" y="778" width="194" height="44" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="175" y="798" text-anchor="middle" font-size="12">Tampilkan hasil</text>
  <text x="175" y="813" text-anchor="middle" font-size="12">transaksi berhasil</text>
  <line x1="175" y1="822" x2="175" y2="852" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- STEP 12: SELESAI (oval, L1, cy=880) -->
  <ellipse cx="175" cy="880" rx="84" ry="26" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="175" y="885" text-anchor="middle" font-size="13" font-weight="bold">Selesai</text>

  <!-- LEGEND -->
  <rect x="370" y="895" width="302" height="118" rx="3" fill="white" stroke="#999" stroke-width="1"/>
  <text x="521" y="915" text-anchor="middle" font-size="11" font-weight="bold">Keterangan Simbol</text>
  <ellipse cx="398" cy="940" rx="18" ry="11" fill="white" stroke="#333" stroke-width="1.2"/>
  <text x="424" y="944" font-size="10">= Mulai / Selesai (Terminal)</text>
  <rect x="383" y="960" width="30" height="16" fill="white" stroke="#333" stroke-width="1.2"/>
  <text x="424" y="973" font-size="10">= Proses / Aktivitas</text>
  <polygon points="398,984 412,995 398,1006 384,995" fill="white" stroke="#333" stroke-width="1.2"/>
  <text x="424" y="999" font-size="10">= Keputusan / Kondisi</text>

</svg>
</div>
</body>
</html>
