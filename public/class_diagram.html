<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Class Diagram - Inventaris JJ Mart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #b0b0b0;
      font-family: Arial, sans-serif;
      padding: 28px 18px 50px;
    }

    h1 {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #222;
      margin-bottom: 16px;
    }

    .wrap {
      display: flex;
      justify-content: center;
    }

    svg {
      background: white;
      border: 2px solid #444;
      box-shadow: 3px 3px 12px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>

<body>
  <h1>Class Diagram - Sistem Inventaris JJ Mart</h1>
  <div class="wrap">
    <svg width="1060" height="870" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" font-size="10">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#555" />
        </marker>
        <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
          <path d="M0,0 L10,5 L0,10" fill="none" stroke="#555" stroke-width="1.5" />
        </marker>
      </defs>

      <!-- ============ SECTION LABELS ============ -->
      <rect x="10" y="10" width="700" height="470" fill="#f7faff" stroke="#c0d0e8" stroke-width="1" rx="5"
        stroke-dasharray="6,3" />
      <text x="355" y="28" text-anchor="middle" font-size="11" fill="#334" font-style="italic">[ Models (Eloquent)
        ]</text>
      <rect x="730" y="10" width="310" height="470" fill="#f7fff7" stroke="#b0d8b0" stroke-width="1" rx="5"
        stroke-dasharray="6,3" />
      <text x="885" y="28" text-anchor="middle" font-size="11" fill="#334" font-style="italic">[ Services ]</text>
      <rect x="10" y="500" width="1030" height="350" fill="#fffaf0" stroke="#d8c0a0" stroke-width="1" rx="5"
        stroke-dasharray="6,3" />
      <text x="525" y="518" text-anchor="middle" font-size="11" fill="#334" font-style="italic">[ Controllers (HTTP
        Pengendali) ]</text>

      <!-- Helper macro: each class = stereotype header + name header + attr rows + separator + method rows -->

      <!-- ===== CLASS: User (x=20, y=40) ===== -->
      <rect x="20" y="40" width="215" height="190" fill="white" stroke="#333" stroke-width="1.5" rx="2" />
      <rect x="20" y="40" width="215" height="22" fill="#e8eaf6" rx="2" />
      <rect x="20" y="57" width="215" height="5" fill="#e8eaf6" />
      <text x="127" y="56" text-anchor="middle" font-size="9" fill="#555"
        font-style="italic">&lt;&lt;Model&gt;&gt;</text>
      <rect x="20" y="62" width="215" height="26" fill="#3949ab" />
      <text x="127" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="white">User</text>
      <line x1="20" y1="88" x2="235" y2="88" stroke="#333" stroke-width="1" />
      <text x="28" y="103">+ id: int</text>
      <line x1="20" y1="108" x2="235" y2="108" stroke="#eee" />
      <text x="28" y="123">+ name: string</text>
      <line x1="20" y1="128" x2="235" y2="128" stroke="#eee" />
      <text x="28" y="143">+ email: string</text>
      <line x1="20" y1="148" x2="235" y2="148" stroke="#eee" />
      <text x="28" y="163"># peran: enum</text>
      <line x1="20" y1="168" x2="235" y2="168" stroke="#333" stroke-width="1" />
      <text x="28" y="183">+ isAdmin(): bool</text>
      <line x1="20" y1="188" x2="235" y2="188" stroke="#eee" />
      <text x="28" y="203">+ transaksi(): HasMany</text>
      <line x1="20" y1="208" x2="235" y2="208" stroke="#eee" />
      <text x="28" y="223">+ muatProfil(): User</text>

      <!-- ===== CLASS: Barang (x=255, y=40) ===== -->
      <rect x="255" y="40" width="215" height="250" fill="white" stroke="#333" stroke-width="1.5" rx="2" />
      <rect x="255" y="40" width="215" height="22" fill="#e8eaf6" rx="2" />
      <rect x="255" y="57" width="215" height="5" fill="#e8eaf6" />
      <text x="362" y="56" text-anchor="middle" font-size="9" fill="#555"
        font-style="italic">&lt;&lt;Model&gt;&gt;</text>
      <rect x="255" y="62" width="215" height="26" fill="#3949ab" />
      <text x="362" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Barang</text>
      <line x1="255" y1="88" x2="470" y2="88" stroke="#333" stroke-width="1" />
      <text x="263" y="103">+ kode_barang: string</text>
      <line x1="255" y1="108" x2="470" y2="108" stroke="#eee" />
      <text x="263" y="123">+ nama: string</text>
      <line x1="255" y1="128" x2="470" y2="128" stroke="#eee" />
      <text x="263" y="143">+ stok_saat_ini: int</text>
      <line x1="255" y1="148" x2="470" y2="148" stroke="#eee" />
      <text x="263" y="163">+ stok_minimum: int</text>
      <line x1="255" y1="168" x2="470" y2="168" stroke="#eee" />
      <text x="263" y="183">+ rop: int</text>
      <line x1="255" y1="188" x2="470" y2="188" stroke="#eee" />
      <text x="263" y="203">+ harga_beli: decimal</text>
      <line x1="255" y1="208" x2="470" y2="208" stroke="#eee" />
      <text x="263" y="223"># aktif: bool</text>
      <line x1="255" y1="228" x2="470" y2="228" stroke="#333" stroke-width="1" />
      <text x="263" y="243">+ getStatusStokAttribute(): string</text>
      <line x1="255" y1="248" x2="470" y2="248" stroke="#eee" />
      <text x="263" y="263">+ kategori(): BelongsTo</text>
      <line x1="255" y1="268" x2="470" y2="268" stroke="#eee" />
      <text x="263" y="283">+ transaksi(): HasMany</text>

      <!-- ===== CLASS: Kategori (x=490, y=40) ===== -->
      <rect x="490" y="40" width="200" height="160" fill="white" stroke="#333" stroke-width="1.5" rx="2" />
      <rect x="490" y="40" width="200" height="22" fill="#e8eaf6" rx="2" />
      <rect x="490" y="57" width="200" height="5" fill="#e8eaf6" />
      <text x="590" y="56" text-anchor="middle" font-size="9" fill="#555"
        font-style="italic">&lt;&lt;Model&gt;&gt;</text>
      <rect x="490" y="62" width="200" height="26" fill="#3949ab" />
      <text x="590" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Kategori</text>
      <line x1="490" y1="88" x2="690" y2="88" stroke="#333" stroke-width="1" />
      <text x="498" y="103">+ id: int</text>
      <line x1="490" y1="108" x2="690" y2="108" stroke="#eee" />
      <text x="498" y="123">+ nama: string</text>
      <line x1="490" y1="128" x2="690" y2="128" stroke="#eee" />
      <text x="498" y="143">+ deskripsi: text</text>
      <line x1="490" y1="148" x2="690" y2="148" stroke="#333" stroke-width="1" />
      <text x="498" y="163">+ barang(): HasMany</text>

      <!-- ===== CLASS: Pemasok (x=20, y=280) ===== -->
      <rect x="20" y="280" width="215" height="180" fill="white" stroke="#333" stroke-width="1.5" rx="2" />
      <rect x="20" y="280" width="215" height="22" fill="#e8eaf6" rx="2" />
      <rect x="20" y="297" width="215" height="5" fill="#e8eaf6" />
      <text x="127" y="296" text-anchor="middle" font-size="9" fill="#555"
        font-style="italic">&lt;&lt;Model&gt;&gt;</text>
      <rect x="20" y="302" width="215" height="26" fill="#3949ab" />
      <text x="127" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Pemasok</text>
      <line x1="20" y1="328" x2="235" y2="328" stroke="#333" stroke-width="1" />
      <text x="28" y="343">+ nama: string</text>
      <line x1="20" y1="348" x2="235" y2="348" stroke="#eee" />
      <text x="28" y="363">+ kontak: string</text>
      <line x1="20" y1="368" x2="235" y2="368" stroke="#eee" />
      <text x="28" y="383">+ telepon: string</text>
      <line x1="20" y1="388" x2="235" y2="388" stroke="#eee" />
      <text x="28" y="403">+ email: string</text>
      <line x1="20" y1="408" x2="235" y2="408" stroke="#333" stroke-width="1" />
      <text x="28" y="423">+ barang(): HasMany</text>
      <line x1="20" y1="428" x2="235" y2="428" stroke="#eee" />
      <text x="28" y="443">+ transaksi(): HasManyThrough</text>

      <!-- ===== CLASS: Transaksi (x=255, y=300) ===== -->
      <rect x="255" y="300" width="215" height="180" fill="white" stroke="#333" stroke-width="1.5" rx="2" />
      <rect x="255" y="300" width="215" height="22" fill="#e8eaf6" rx="2" />
      <rect x="255" y="317" width="215" height="5" fill="#e8eaf6" />
      <text x="362" y="316" text-anchor="middle" font-size="9" fill="#555"
        font-style="italic">&lt;&lt;Model&gt;&gt;</text>
      <rect x="255" y="322" width="215" height="26" fill="#3949ab" />
      <text x="362" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Transaksi</text>
      <line x1="255" y1="348" x2="470" y2="348" stroke="#333" stroke-width="1" />
      <text x="263" y="363">+ jenis: enum</text>
      <line x1="255" y1="368" x2="470" y2="368" stroke="#eee" />
      <text x="263" y="383">+ jumlah: int</text>
      <line x1="255" y1="388" x2="470" y2="388" stroke="#eee" />
      <text x="263" y="403">+ stok_sebelum: int</text>
      <line x1="255" y1="408" x2="470" y2="408" stroke="#eee" />
      <text x="263" y="423">+ harga_satuan: decimal</text>
      <line x1="255" y1="428" x2="470" y2="428" stroke="#333" stroke-width="1" />
      <text x="263" y="443">+ barang(): BelongsTo</text>
      <line x1="255" y1="448" x2="470" y2="448" stroke="#eee" />
      <text x="263" y="463">+ pengguna(): BelongsTo</text>


      <!-- ===== CLASS: LayananHitungROP (x=740, y=40) ===== -->
      <rect x="740" y="40" width="290" height="140" fill="white" stroke="#333" stroke-width="1.5" rx="2" />
      <rect x="740" y="40" width="290" height="22" fill="#e8f5e9" rx="2" />
      <rect x="740" y="57" width="290" height="5" fill="#e8f5e9" />
      <text x="885" y="56" text-anchor="middle" font-size="9" fill="#2e7d32"
        font-style="italic">&lt;&lt;Service&gt;&gt;</text>
      <rect x="740" y="62" width="290" height="26" fill="#2e7d32" />
      <text x="885" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="white">LayananHitungROP</text>
      <line x1="740" y1="88" x2="1030" y2="88" stroke="#333" stroke-width="1" />
      <text x="748" y="105">- (no public attributes)</text>
      <line x1="740" y1="110" x2="1030" y2="110" stroke="#333" stroke-width="1" />
      <text x="748" y="128">+ hitungDanSimpan(Barang): void</text>
      <line x1="740" y1="133" x2="1030" y2="133" stroke="#eee" />
      <text x="748" y="150">+ hitungROP(Barang): int</text>

      <!-- ===== CLASS: LayananCekStok (x=740, y=210) ===== -->
      <rect x="740" y="210" width="290" height="130" fill="white" stroke="#333" stroke-width="1.5" rx="2" />
      <rect x="740" y="210" width="290" height="22" fill="#e8f5e9" rx="2" />
      <rect x="740" y="227" width="290" height="5" fill="#e8f5e9" />
      <text x="885" y="226" text-anchor="middle" font-size="9" fill="#2e7d32"
        font-style="italic">&lt;&lt;Service&gt;&gt;</text>
      <rect x="740" y="232" width="290" height="26" fill="#2e7d32" />
      <text x="885" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="white">LayananCekStok</text>
      <line x1="740" y1="258" x2="1030" y2="258" stroke="#333" stroke-width="1" />
      <text x="748" y="275">- layananROP: LayananHitungROP</text>
      <line x1="740" y1="280" x2="1030" y2="280" stroke="#333" stroke-width="1" />
      <text x="748" y="297">+ cekDanNotifikasi(Barang): string</text>
      <line x1="740" y1="302" x2="1030" y2="302" stroke="#eee" />
      <text x="748" y="320">- (calls hitungDanSimpan)</text>

      <!-- ===== CONTROLLERS ROW (y=530) ===== -->
      <!-- PengendaliAutentikasi x=20 -->
      <rect x="20" y="530" width="190" height="170" fill="white" stroke="#333" stroke-width="1.5" rx="2" />
      <rect x="20" y="530" width="190" height="22" fill="#fce4ec" rx="2" />
      <rect x="20" y="547" width="190" height="5" fill="#fce4ec" />
      <text x="115" y="546" text-anchor="middle" font-size="9" fill="#880e4f"
        font-style="italic">&lt;&lt;Controller&gt;&gt;</text>
      <rect x="20" y="552" width="190" height="26" fill="#880e4f" />
      <text x="115" y="570" text-anchor="middle" font-size="11" font-weight="bold"
        fill="white">PengendaliAutentikasi</text>
      <line x1="20" y1="578" x2="210" y2="578" stroke="#333" stroke-width="1" />
      <text x="28" y="597">+ masuk(Request): JsonResponse</text>
      <line x1="20" y1="602" x2="210" y2="602" stroke="#eee" />
      <text x="28" y="621">+ keluar(Request): JsonResponse</text>
      <line x1="20" y1="626" x2="210" y2="626" stroke="#eee" />
      <text x="28" y="645">+ profil(Request): JsonResponse</text>
      <line x1="20" y1="650" x2="210" y2="650" stroke="#eee" />
      <text x="28" y="669">+ perbarui(Request): JsonResponse</text>

      <!-- PengendaliBarang x=225 -->
      <rect x="225" y="530" width="190" height="190" fill="white" stroke="#333" stroke-width="1.5" rx="2" />
      <rect x="225" y="530" width="190" height="22" fill="#fce4ec" rx="2" />
      <rect x="225" y="547" width="190" height="5" fill="#fce4ec" />
      <text x="320" y="546" text-anchor="middle" font-size="9" fill="#880e4f"
        font-style="italic">&lt;&lt;Controller&gt;&gt;</text>
      <rect x="225" y="552" width="190" height="26" fill="#880e4f" />
      <text x="320" y="570" text-anchor="middle" font-size="11" font-weight="bold" fill="white">PengendaliBarang</text>
      <line x1="225" y1="578" x2="415" y2="578" stroke="#333" stroke-width="1" />
      <text x="233" y="597">+ index(Request)</text>
      <line x1="225" y1="602" x2="415" y2="602" stroke="#eee" />
      <text x="233" y="621">+ simpan(Request)</text>
      <line x1="225" y1="626" x2="415" y2="626" stroke="#eee" />
      <text x="233" y="645">+ tampil(Barang)</text>
      <line x1="225" y1="650" x2="415" y2="650" stroke="#eee" />
      <text x="233" y="669">+ perbarui(Request, Barang)</text>
      <line x1="225" y1="674" x2="415" y2="674" stroke="#eee" />
      <text x="233" y="693">+ hapus(Barang)</text>
      <line x1="225" y1="698" x2="415" y2="698" stroke="#eee" />
      <text x="233" y="717">+ hitungUlangROP(Barang)</text>

      <!-- PengendaliTransaksi x=430 -->
      <rect x="430" y="530" width="190" height="150" fill="white" stroke="#333" stroke-width="1.5" rx="2" />
      <rect x="430" y="530" width="190" height="22" fill="#fce4ec" rx="2" />
      <rect x="430" y="547" width="190" height="5" fill="#fce4ec" />
      <text x="525" y="546" text-anchor="middle" font-size="9" fill="#880e4f"
        font-style="italic">&lt;&lt;Controller&gt;&gt;</text>
      <rect x="430" y="552" width="190" height="26" fill="#880e4f" />
      <text x="525" y="570" text-anchor="middle" font-size="11" font-weight="bold"
        fill="white">PengendaliTransaksi</text>
      <line x1="430" y1="578" x2="620" y2="578" stroke="#333" stroke-width="1" />
      <text x="438" y="597">+ index(Request)</text>
      <line x1="430" y1="602" x2="620" y2="602" stroke="#eee" />
      <text x="438" y="621">+ simpan(Request)</text>
      <line x1="430" y1="626" x2="620" y2="626" stroke="#eee" />
      <text x="438" y="645">+ tampil(Transaksi)</text>
      <!-- uses LayananCekStok -->
      <line x1="430" y1="650" x2="620" y2="650" stroke="#ccc" stroke-dasharray="4,2" />
      <text x="438" y="665" fill="#888">uses: LayananCekStok</text>

      <!-- PengendaliDasbor x=635 -->
      <rect x="635" y="530" width="190" height="150" fill="white" stroke="#333" stroke-width="1.5" rx="2" />
      <rect x="635" y="530" width="190" height="22" fill="#fce4ec" rx="2" />
      <rect x="635" y="547" width="190" height="5" fill="#fce4ec" />
      <text x="730" y="546" text-anchor="middle" font-size="9" fill="#880e4f"
        font-style="italic">&lt;&lt;Controller&gt;&gt;</text>
      <rect x="635" y="552" width="190" height="26" fill="#880e4f" />
      <text x="730" y="570" text-anchor="middle" font-size="11" font-weight="bold" fill="white">PengendaliDasbor</text>
      <line x1="635" y1="578" x2="825" y2="578" stroke="#333" stroke-width="1" />
      <text x="643" y="597">+ ringkasan(Request)</text>
      <line x1="635" y1="602" x2="825" y2="602" stroke="#eee" />
      <text x="643" y="621">+ trendPemakaian(Request)</text>
      <line x1="635" y1="626" x2="825" y2="626" stroke="#eee" />
      <text x="643" y="645">+ barangKritis(Request)</text>

      <!-- PengendaliLaporan x=840 -->
      <rect x="840" y="530" width="200" height="150" fill="white" stroke="#333" stroke-width="1.5" rx="2" />
      <rect x="840" y="530" width="200" height="22" fill="#fce4ec" rx="2" />
      <rect x="840" y="547" width="200" height="5" fill="#fce4ec" />
      <text x="940" y="546" text-anchor="middle" font-size="9" fill="#880e4f"
        font-style="italic">&lt;&lt;Controller&gt;&gt;</text>
      <rect x="840" y="552" width="200" height="26" fill="#880e4f" />
      <text x="940" y="570" text-anchor="middle" font-size="11" font-weight="bold" fill="white">PengendaliLaporan</text>
      <line x1="840" y1="578" x2="1040" y2="578" stroke="#333" stroke-width="1" />
      <text x="848" y="597">+ stokSaatIni(Request)</text>
      <line x1="840" y1="602" x2="1040" y2="602" stroke="#eee" />
      <text x="848" y="621">+ riwayatTransaksi(Request)</text>
      <line x1="840" y1="626" x2="1040" y2="626" stroke="#eee" />
      <text x="848" y="645">+ riwayatReorder(Request)</text>

      <!-- ===== RELATIONSHIP LINES ===== -->
      <!-- User 1 --- N Transaksi -->
      <line x1="235" y1="220" x2="280" y2="348" stroke="#888" stroke-width="1.2" stroke-dasharray="5,3"
        marker-end="url(#open)" />
      <text x="230" y="260" font-size="9" fill="#888">1</text>
      <text x="275" y="340" font-size="9" fill="#888">N</text>

      <!-- Barang 1 --- N Transaksi -->
      <line x1="362" y1="290" x2="362" y2="322" stroke="#888" stroke-width="1.2" marker-end="url(#open)" />
      <text x="368" y="315" font-size="9" fill="#888">N</text>

      <!-- Kategori --- Barang -->
      <line x1="490" y1="122" x2="470" y2="122" stroke="#888" stroke-width="1.2" marker-end="url(#open)" />
      <text x="480" y="116" font-size="9" fill="#888">N</text>

      <!-- LayananCekStok uses LayananHitungROP -->
      <line x1="885" y1="210" x2="885" y2="180" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="5,3"
        marker-end="url(#arrow)" />

      <!-- PengendaliTransaksi uses LayananCekStok -->
      <line x1="525" y1="530" x2="810" y2="340" stroke="#666" stroke-width="1" stroke-dasharray="4,2"
        marker-end="url(#arrow)" />

      <!-- PengendaliBarang uses LayananHitungROP -->
      <line x1="320" y1="530" x2="800" y2="180" stroke="#666" stroke-width="1" stroke-dasharray="4,2"
        marker-end="url(#arrow)" />

      <!-- Legend -->
      <rect x="740" y="380" width="290" height="100" rx="3" fill="white" stroke="#ccc" stroke-width="1" />
      <text x="885" y="398" text-anchor="middle" font-size="11" font-weight="bold">Keterangan</text>
      <line x1="750" y1="414" x2="780" y2="414" stroke="#888" stroke-width="1.2" />
      <path d="M775,410 L783,414 L775,418" fill="none" stroke="#888" stroke-width="1.5" />
      <text x="790" y="418" font-size="10">= Asosiasi / Navigasi</text>
      <line x1="750" y1="434" x2="780" y2="434" stroke="#888" stroke-width="1.2" stroke-dasharray="4,2" />
      <path d="M775,430 L783,434 L775,438" fill="none" stroke="#888" stroke-width="1.5" />
      <text x="790" y="438" font-size="10">= Dependency (uses)</text>
      <text x="750" y="458" font-size="10">+ = public # = protected - = private</text>
    </svg>
  </div>
</body>

</html>
